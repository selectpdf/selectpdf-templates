name: ci

on:
  push:
  pull_request:

jobs:
  templates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        edition: [community, full]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pack and install
        run: |
          dotnet pack -c Release -o out
          dotnet new install ./out/SelectPdf.Templates.1.0.0.nupkg
          dotnet new list pdf
      - name: Generate and build every template x framework
        shell: bash
        run: |
          for f in net8.0 net10.0; do
            dotnet new selectpdf-invoice -o gen/inv-$f -n Acme.Billing --edition ${{ matrix.edition }} -f $f
            dotnet new selectpdf-console -o gen/con-$f -n HtmlToPdf --edition ${{ matrix.edition }} -f $f
            dotnet build gen/inv-$f -c Release
            dotnet build gen/con-$f -c Release
          done
      - name: Console app produces a real PDF
        shell: bash
        run: |
          echo '<h1>Hello from CI</h1><p style="display:grid">grid</p>' > gen/page.html
          dotnet run --project gen/con-net10.0 -c Release -- gen/page.html gen/page.pdf
          head -c 5 gen/page.pdf | grep -q '%PDF-'
      - name: Invoice API returns a PDF
        shell: bash
        run: |
          dotnet run --project gen/inv-net10.0 -c Release --urls http://127.0.0.1:5080 &
          for i in $(seq 1 60); do curl -sf -o gen/invoice.pdf http://127.0.0.1:5080/invoices/INV-1001.pdf && break; sleep 2; done
          head -c 5 gen/invoice.pdf | grep -q '%PDF-'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdfs-${{ matrix.os }}-${{ matrix.edition }}
          path: gen/*.pdf

  docker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Invoice API in Docker returns a PDF (no apt-get in the Dockerfile)
        run: |
          dotnet pack -c Release -o out
          dotnet new install ./out/SelectPdf.Templates.1.0.0.nupkg
          dotnet new selectpdf-invoice -o inv -n Acme.Billing
          docker build -t invoice inv
          docker run -d -p 8080:8080 invoice
          for i in $(seq 1 60); do curl -sf -o invoice.pdf http://127.0.0.1:8080/invoices/INV-1001.pdf && break; sleep 2; done
          head -c 5 invoice.pdf | grep -q '%PDF-'
